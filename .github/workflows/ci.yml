name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run tsc --noEmit

      - name: Lint
        run: bun run next lint

      - name: Build
        run: bun run next build
        env:
          # CI build uses placeholder values — env validation only throws in production
          AUTH_SECRET: "ci-placeholder-secret-for-build-1234567890ab"
          AUTH_URL: "https://marrowstack.dev"
          GITHUB_CLIENT_ID: "ci"
          GITHUB_CLIENT_SECRET: "ci"
          GITHUB_DELIVERY_PAT: "ci"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci"
          SUPABASE_SERVICE_ROLE_KEY: "ci"
          DODO_PAYMENTS_API_KEY: "ci"
          DODO_PAYMENTS_WEBHOOK_SECRET: "ci"
          DODO_PAYMENTS_MODE: "test"
          NEXT_PUBLIC_APP_URL: "https://marrowstack.dev"
          ADMIN_EMAILS: "admin@marrowstack.dev"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test
